<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Secure Messenger</title>

<style>
body { margin:0; font-family:"Segoe UI", sans-serif; background:#0f172a; color:white; display:flex; height:100vh; }
#login { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; }
#login input { padding:10px; margin:10px; width:200px; border-radius:5px; border:none; }
#login button { padding:10px 20px; cursor:pointer; border-radius:5px; border:none; background:#2563eb; color:white; }
#messenger { display:none; flex:1; flex-direction:row; }
.sidebar { width:280px; background:#1e293b; display:flex; flex-direction:column; }
.sidebar h3 { margin:15px; font-size:16px; color:#cbd5e1; }
.sidebar button { margin:0 15px 10px 15px; padding:8px; background:#2563eb; border:none; border-radius:5px; color:white; cursor:pointer; }
#chats { flex:1; overflow-y:auto; margin:0 10px; }
.chat-item { padding:10px; margin-bottom:5px; border-radius:8px; cursor:pointer; background:#334155; }
.chat-item.active { background:#2563eb; }
.chat { flex:1; display:flex; flex-direction:column; }
.messages { flex:1; padding:10px; overflow-y:auto; display:flex; flex-direction:column; }
.message { padding:10px 14px; border-radius:18px; margin:5px; max-width:70%; word-wrap:break-word; }
.me { background:#2563eb; align-self:flex-end; color:white; }
.other { background:#334155; align-self:flex-start; color:white; }
.input { display:flex; padding:10px; background:#1e293b; }
input { flex:1; padding:10px; border-radius:20px; border:none; background:#334155; color:white; }
button { padding:10px 15px; margin-left:10px; border-radius:20px; border:none; background:#2563eb; color:white; cursor:pointer; }
.indicator { text-align:center; font-size:12px; color:#94a3b8; margin:5px 0; }
</style>
</head>

<body>

<div id="login">
  <h2>Введите UID (например u1-u10)</h2>
  <input id="uidInput" placeholder="UID">
  <button onclick="login()">Войти</button>
</div>

<div id="messenger">
  <div class="sidebar">
    <h3>👤 <span id="me"></span></h3>
    <button onclick="newChat()">➕ чат</button>
    <div id="chats"></div>
  </div>

  <div class="chat">
    <div id="messages" class="messages"></div>
    <div class="input">
      <input id="msg" placeholder="Введите сообщение">
      <button onclick="send()">Send</button>
    </div>
  </div>
</div>

<script>
const APP_KEY = "a4b430ec-a756-40f7-9db4-7959c379eafd";

let ws;
let myId;
let currentChat = null;
let chats = JSON.parse(localStorage.getItem("chats") || "{}");
let keyPair;
let sharedKeys = {}; // chatId -> AES key
let pendingKeys = {}; // chatId -> ждём ключ

async function login() {
  const val = document.getElementById("uidInput").value.trim();
  if(!val) return alert("Введите UID");
  myId = val;

  document.getElementById("login").style.display = "none";
  document.getElementById("messenger").style.display = "flex";
  document.getElementById("me").innerText = myId;

  keyPair = await crypto.subtle.generateKey(
    { name: "ECDH", namedCurve: "P-256" },
    true,
    ["deriveKey"]
  );

  connect();
  renderChats();
}

function connect() {
  ws = new WebSocket(`wss://ws.apinator.io/v1/${APP_KEY}?channel=secure`);

  ws.onmessage = async (e) => {
    const data = JSON.parse(e.data);

    if(data.type === "key" && data.to === myId) {
      await handleKeyExchange(data);
    }

    if(data.type === "msg" && data.chat === currentChat) {
      const key = sharedKeys[data.chat];
      if(!key) return;
      const text = await decrypt(key, data);
      addMessage(data.from, text);
    }
  };
}

function newChat() {
  const other = prompt("UID пользователя:");
  if(!other) return;
  const chatId = [myId, other].sort().join("_");

  chats[chatId] = true;
  localStorage.setItem("chats", JSON.stringify(chats));

  pendingKeys[chatId] = true;
  exchangeKeys(chatId, other);
  renderChats();
}

function renderChats() {
  const el = document.getElementById("chats");
  el.innerHTML = "";

  Object.keys(chats).forEach(c => {
    const div = document.createElement("div");
    div.className = "chat-item" + (c===currentChat ? " active" : "");
    div.innerText = c + (pendingKeys[c] ? " ⚠️ Ждём ключ" : "");
    div.onclick = () => selectChat(c);
    el.appendChild(div);
  });
}

async function exchangeKeys(chatId, other) {
  const pub = await crypto.subtle.exportKey("raw", keyPair.publicKey);

  ws.send(JSON.stringify({
    type: "key",
    chat: chatId,
    from: myId,
    to: other,
    pub: btoa(String.fromCharCode(...new Uint8Array(pub)))
  }));
}

async function handleKeyExchange(data) {
  const pub = Uint8Array.from(atob(data.pub), c => c.charCodeAt(0));

  const otherKey = await crypto.subtle.importKey(
    "raw", pub, { name:"ECDH", namedCurve:"P-256" }, true, []
  );

  const shared = await crypto.subtle.deriveKey(
    { name:"ECDH", public: otherKey },
    keyPair.privateKey,
    { name:"AES-GCM", length:256 },
    false,
    ["encrypt","decrypt"]
  );

  sharedKeys[data.chat] = shared;
  pendingKeys[data.chat] = false;
  renderChats();
  if(currentChat === data.chat) addIndicator("🔑 Ключ получен, можно писать");
}

async function encrypt(key, text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder().encode(text);
  const cipher = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc);
  return { cipher: btoa(String.fromCharCode(...new Uint8Array(cipher))), iv: btoa(String.fromCharCode(...iv)) };
}

async function decrypt(key, data) {
  const iv = Uint8Array.from(atob(data.iv), c=>c.charCodeAt(0));
  const cipher = Uint8Array.from(atob(data.cipher), c=>c.charCodeAt(0));
  const dec = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, cipher);
  return new TextDecoder().decode(dec);
}

async function send() {
  const text = document.getElementById("msg").value;
  if(!currentChat) return;

  const key = sharedKeys[currentChat];
  if(!key) return addIndicator("⚠️ Ждём ключ от собеседника…");

  const enc = await encrypt(key, text);

  ws.send(JSON.stringify({
    type:"msg",
    chat:currentChat,
    from:myId,
    ...enc
  }));

  addMessage(myId, text);
  document.getElementById("msg").value = "";
}

function selectChat(chat) {
  currentChat = chat;
  document.getElementById("messages").innerHTML = "";
  renderChats();
}

function addMessage(from, text) {
  const div = document.createElement("div");
  div.className = "message " + (from === myId ? "me" : "other");
  div.innerText = from + ": " + text;
  document.getElementById("messages").appendChild(div);
}

function addIndicator(text) {
  const div = document.createElement("div");
  div.className = "indicator";
  div.innerText = text;
  document.getElementById("messages").appendChild(div);
}
</script>

</body>
</html>
